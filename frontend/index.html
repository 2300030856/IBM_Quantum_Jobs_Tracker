<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QBoard</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #0b1222;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --accent: #6366f1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #0b1020, #0f172a);
        color: var(--text);
        font-family: Inter, system-ui, Arial, sans-serif;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }
      .card {
        background: #0b1222;
        border: 1px solid #1e293b;
        border-radius: 16px;
      }
      .card h2 {
        margin: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #1e293b;
        font-size: 16px;
        color: #cbd5e1;
      }
      .card .content {
        padding: 16px;
      }
      input,
      select,
      button {
        background: #0f172a;
        border: 1px solid #1e293b;
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 14px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #1e293b;
        text-align: left;
        font-size: 14px;
      }
      th {
        color: #94a3b8;
        font-weight: 500;
      }
      .badge {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .ok {
        background: #064e3b;
        color: #a7f3d0;
      }
      .bad {
        background: #4c0519;
        color: #fecdd3;
      }
      .muted {
        color: #94a3b8;
      }
      .grid-2-1 {
        grid-column: span 8;
      }
      .grid-1-1 {
        grid-column: span 4;
      }
      @media (max-width: 900px) {
        .grid-2-1 {
          grid-column: span 12;
        }
        .grid-1-1 {
          grid-column: span 12;
        }
      }
      .grid-1-2 {
        grid-column: span 2;
      }
      @media (max-width: 900px) {
        .grid-1-2 {
          grid-column: span 6;
        }
      }
      @media (max-width: 600px) {
        .grid-1-2 {
          grid-column: span 12;
        }
      }

      /* ✅ Landing styles */
      .landing-root {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .landing-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #000000, #030303, #658cda);
        background-size: 400% 400%;
        animation: gradientShift 5s ease infinite;
        z-index: 0;
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .landing-canvas {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .landing-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
      }
      .landing-card {
        background: rgba(0, 0, 0, 0.55);
        padding: 40px 60px;
        border-radius: 16px;
        text-align: center;
        color: white;
        max-width: 600px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
      .landing-card h1 {
        font-size: 2rem;
        margin-bottom: 12px;
      }
      .landing-card .tagline {
        font-size: 1.1rem;
        margin-bottom: 24px;
        opacity: 0.9;
      }
      .cta {
        padding: 12px 24px;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
        transition: transform 0.2s, background 0.3s;
      }
      .cta:hover {
        background: #1d4ed8;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
